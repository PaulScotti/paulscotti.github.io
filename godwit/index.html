<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f6f3ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161513" media="(prefers-color-scheme: dark)">
<title>Godwit</title>
<link rel="icon" href="icons/godwit.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preload" href="../ebis/fonts/Libron-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="godwit.css">
<script type="module" src="godwit.js"></script>
</head>
<body>

<form id="lock" class="lock" hidden>
  <svg class="bird" aria-hidden="true"><use href="#bird"/></svg>
  <h1>godwit</h1>
  <div class="field">
    <input name="password" type="password" autocomplete="current-password" placeholder="Password" aria-label="Password" required>
    <button>Open</button>
  </div>
</form>

<div id="app" class="app" hidden>
  <header class="top">
    <h1><svg class="bird" aria-hidden="true"><use href="#bird"/></svg>godwit</h1>
    <nav id="views" class="views">
      <button data-view="soon">Soon</button><button data-view="later">Later</button><button data-view="routines">Routines</button><button data-view="done">Done</button>
    </nav>
    <div class="tools">
      <button id="find" class="icon" aria-label="Search (/)"><svg><use href="#i-search"/></svg></button>
      <button id="raw" class="icon" aria-label="Edit todo.txt"><svg><use href="#i-text"/></svg></button>
    </div>
  </header>
  <div class="filters">
    <div id="chips" class="chips"></div>
    <div id="search" class="search" hidden><input type="search" placeholder="Search tasks" aria-label="Search tasks" enterkeyhint="search"><button class="icon" aria-label="Close search"><svg><use href="#i-close"/></svg></button></div>
  </div>
  <form id="add" class="add" autocomplete="off">
    <div id="hint" class="hint" hidden></div>
    <div class="line">
      <input name="task" placeholder="Add a task" aria-label="Add a task (n)" enterkeyhint="done" autocapitalize="sentences">
      <button type="button" id="status" class="status" hidden></button>
      <button type="button" id="update" class="status" hidden>Update</button>
    </div>
  </form>
  <main id="board" class="board">
    <section id="soon" class="column"><h2>Soon</h2><div class="list"></div></section>
    <section id="later" class="column"><h2>Later</h2><div class="list"></div></section>
    <section id="routines" class="column"><h2>Routines</h2><div class="list"></div></section>
    <section id="done" class="column"><h2>Done</h2><div class="list"></div></section>
    <section id="found" class="column"><h2>Found</h2><div class="list"></div></section>
  </main>
</div>

<dialog id="sheet" class="sheet" tabindex="-1">
  <form method="dialog">
    <div class="head">
      <button type="button" id="sheet-check" class="check" aria-label="Done"></button>
      <textarea id="title" rows="1" aria-label="Task" enterkeyhint="done"></textarea>
      <button class="icon x" aria-label="Close"><svg><use href="#i-close"/></svg></button>
    </div>
    <p id="parent" class="parent" hidden></p>
    <textarea id="notes" rows="1" placeholder="Notes" aria-label="Notes"></textarea>
    <div class="row"><span>Date</span><div id="dates" class="choices"></div></div>
    <div class="row"><span>Repeat</span><div id="repeats" class="choices"></div></div>
    <div class="row"><span>Priority</span><div id="pris" class="choices"></div></div>
    <div class="row"><span>Category</span><div id="tags" class="choices"></div></div>
    <div class="row kids"><span>Steps</span><div><div id="kids"></div><input id="kid" placeholder="Add a step" aria-label="Add a step" enterkeyhint="done"></div></div>
    <footer><button type="button" id="delete" class="danger">Delete</button><span id="stamp"></span></footer>
  </form>
</dialog>

<dialog id="text" class="sheet text">
  <form method="dialog">
    <div class="head"><h2>todo.txt</h2><button class="icon x" aria-label="Close"><svg><use href="#i-close"/></svg></button></div>
    <textarea id="file" spellcheck="false" aria-label="todo.txt"></textarea>
    <footer><span class="note">One task per line. A leading tab makes a step of the task above.</span><button type="button" id="save" class="primary">Save</button></footer>
  </form>
</dialog>

<div id="toast" class="toast" popover="manual" role="status" aria-live="polite"><span></span><button hidden>Undo</button></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="bird" viewBox="0 0 64 64">
    <path fill="currentColor" fill-rule="evenodd" d="M6 30C12 25.5 24 22.5 34 23C37 23.2 38.6 20 40.6 16.4C42 13.9 45.6 13 47.6 14.4C48.6 15.1 49.2 15.8 49.4 16.4Q56 15.6 63 12.4Q56.2 16.8 49.3 17.8C47.8 19.4 46 20.4 45 22.4C44 25.4 43.6 29.6 39.4 32.4C33 36.4 20 35.6 6 30ZM44.6 16.6a.75 .75 0 1 0 1.5 0a.75 .75 0 1 0-1.5 0Z"/>
    <path fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" d="M30.5 34.6 29.8 45 28.4 56H25M33.5 34.2 34.4 45 35.8 56H39.4"/>
  </symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6"/><path d="m15 15 5 5"/></symbol>
  <symbol id="i-text" viewBox="0 0 24 24"><path d="M5 6.5h14M5 10.5h14M5 14.5h9M8 18.5h11"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="m6.5 6.5 11 11m0-11-11 11"/></symbol>
</svg>
</body>
</html>
