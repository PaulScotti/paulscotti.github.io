<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>Seattle House Tours</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 40'><path d='M15 39s13-13.5 13-24A13 13 0 0 0 2 15c0 10.5 13 24 13 24z' fill='%231f8a5b'/></svg>">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="style.css?v=10">
</head>
<body>
  <div class="app">
    <aside class="panel" id="panel" aria-label="Places">
      <header class="panel-head">
        <div class="title-row">
          <h1 data-t="title">Seattle house tours</h1>
          <button class="lang" id="lang" type="button">한국어</button>
        </div>
        <p class="sub" data-t="subtitle">Oct 16–26 · home base: Green Lake Airbnb</p>
        <div class="legend" id="legend" role="group" aria-label="Filter by status"></div>
        <div class="head-actions">
          <button class="btn btn-primary" id="add-place" type="button" data-t="addPlace">+ Add a place</button>
          <button class="btn sheet-toggle" id="sheet-toggle" type="button" aria-expanded="false" data-t="showList">Show list</button>
        </div>
        <p class="sync" id="sync" aria-live="polite"></p>
      </header>
      <div class="list" id="list"></div>
      <footer class="panel-foot" data-t="footer">Notes and edits are shared with everyone who has this link.</footer>
    </aside>
    <main class="map" id="map" aria-label="Map"></main>
  </div>

  <dialog class="modal" id="add-dialog">
    <form method="dialog" class="modal-body" id="add-form">
      <h2 data-t="addPlaceTitle">Add a place</h2>
      <label><span data-t="address">Address</span> *<input name="address" required placeholder="1234 NW 56th St, Seattle, WA 98107"></label>
      <label><span data-t="listingUrl">Listing link</span><input name="listing_url" type="url" placeholder="https://…"></label>
      <label><span data-t="name">Name</span><input name="name" data-tp="namePlaceholder" placeholder="Optional, e.g. building name"></label>
      <div class="grid-2">
        <label><span data-t="status">Status</span>
          <select name="status">
            <option value="none" data-t="st_none">Not contacted</option>
            <option value="contacted" data-t="st_contacted">Contacted</option>
            <option value="booked" data-t="st_booked">Tour booked</option>
          </select>
        </label>
        <label><span data-t="tourTime">Tour time</span><input name="tour_at" type="datetime-local" min="2026-10-16T00:00" max="2026-10-26T23:59"></label>
      </div>
      <label><span data-t="requested">Dates requested / status</span><input name="requested" data-tp="requestedPlaceholder" placeholder="e.g. asked for Oct 19 or 20"></label>
      <div class="grid-3">
        <label><span data-t="rent">Rent</span><input name="rent" placeholder="$4,200/mo"></label>
        <label><span data-t="sqft">Sq ft</span><input name="sqft" inputmode="numeric"></label>
        <label><span data-t="type">Type</span>
          <select name="type">
            <option value="">—</option>
            <option>Apartment</option><option>Townhouse</option><option>Single-family house</option>
            <option>Duplex / multiplex unit</option><option>Upper unit of house</option><option>Condo</option>
          </select>
        </label>
      </div>
      <div class="grid-3">
        <label><span data-t="beds">Beds</span><input name="beds" inputmode="decimal"></label>
        <label><span data-t="baths">Baths</span><input name="baths" inputmode="decimal"></label>
        <label><span data-t="yourName">Your name</span><input name="by" autocomplete="name"></label>
      </div>
      <p class="form-note" data-t="addNote">We'll find it on the map and pull a photo from the listing link when the site allows it.</p>
      <p class="form-error" id="add-error" role="alert"></p>
      <div class="modal-actions">
        <button class="btn" value="cancel" formnovalidate data-t="cancel">Cancel</button>
        <button class="btn btn-primary" id="add-submit" value="ok" data-t="addToMap">Add to map</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="app.js?v=10"></script>
</body>
</html>
