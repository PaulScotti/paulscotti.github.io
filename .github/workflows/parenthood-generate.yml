# Daily digest for /parenthood: reads the encrypted state from the `parenthood-data` branch (plus notes emailed to
# the digest), has Claude plan/research/write the day's bilingual digest, validates it, and commits the encrypted
# result back to `parenthood-data`. Master is never touched. Logs contain status lines only (this repo is public).
# Setup: parenthood/SETUP.md
name: parenthood-generate

on:
  schedule:
    - cron: '17 13 * * *'  # ~6:17am PDT / 5:17am PST
    - cron: '17 17 * * *'  # retry ~10am PT (no-op if today's digest exists)
    - cron: '17 21 * * *'  # retry ~2pm PT
    - cron: '17 0 * * *'   # last retry ~5pm PT, well before the 8:30pm email
  workflow_dispatch:
    inputs:
      date:
        description: 'Pacific date to generate (YYYY-MM-DD). Default: today.'
        required: false
      force:
        description: 'Regenerate even if that day already exists'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: parenthood-generate
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HAS_PASSPHRASE: ${{ secrets.PARENTHOOD_PASSPHRASE != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: parenthood
          fetch-depth: 1

      - name: Check out encrypted data
        if: env.HAS_PASSPHRASE == 'true'
        uses: actions/checkout@v4
        with:
          ref: parenthood-data
          path: data
          fetch-depth: 0

      - uses: actions/setup-node@v4
        if: env.HAS_PASSPHRASE == 'true'
        with:
          node-version: 22

      - name: Install pipeline dependencies and Claude Code
        if: env.HAS_PASSPHRASE == 'true'
        run: |
          npm ci --prefix parenthood/pipeline --no-audit --no-fund
          npm install -g @anthropic-ai/claude-code --no-audit --no-fund

      - name: Generate today's digest
        if: env.HAS_PASSPHRASE == 'true'
        env:
          PARENTHOOD_PASSPHRASE: ${{ secrets.PARENTHOOD_PASSPHRASE }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          PARENTHOOD_MODEL: ${{ vars.PARENTHOOD_MODEL }}
          INPUT_DATE: ${{ inputs.date }}
          INPUT_FORCE: ${{ inputs.force }}
        run: |
          args=(--data data)
          if [ -n "$INPUT_DATE" ]; then args+=(--date "$INPUT_DATE"); fi
          if [ "$INPUT_FORCE" = "true" ]; then args+=(--force); fi
          node parenthood/pipeline/generate.mjs "${args[@]}"

      - name: Save encrypted data
        if: always() && env.HAS_PASSPHRASE == 'true'
        working-directory: data
        run: |
          git config user.name "parenthood-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No data changes."; exit 0; fi
          git commit -q -m "Update parenthood data"
          for i in 1 2 3; do git pull -q --rebase origin parenthood-data && git push -q origin HEAD:parenthood-data && exit 0; sleep 5; done
          exit 1
